<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listing preview — Visit Baa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>
body{background:#f4fbf9;color:#082b32}.preview-shell{max-width:1080px;margin:0 auto;padding:28px 18px 70px}.preview-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;margin-bottom:18px;border:1px solid #d5e6e3;border-radius:16px;background:#fff}.preview-badge{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#0b737c}.preview-hero{overflow:hidden;border:1px solid #dbe8e5;border-radius:24px;background:#fff}.preview-cover{min-height:280px;background:#dfecea center/cover no-repeat;display:grid;place-items:center;color:#70868a}.preview-content{padding:28px}.preview-content h1{font:800 clamp(30px,5vw,52px)/1.05 Manrope,sans-serif;margin:6px 0 12px}.preview-meta{display:flex;gap:8px;flex-wrap:wrap;color:#557074;font-weight:700}.preview-price{font:800 28px Manrope,sans-serif;margin:22px 0}.preview-grid{display:grid;grid-template-columns:1.4fr .6fr;gap:22px;margin-top:22px}.preview-card{border:1px solid #dbe8e5;border-radius:18px;background:#fff;padding:20px}.preview-card h2{margin-top:0}.preview-card p{white-space:pre-line;color:#526b70}.preview-list{display:flex;flex-wrap:wrap;gap:8px}.preview-list span{padding:7px 10px;border-radius:999px;background:#edf8f6;font-size:12px;font-weight:700}.preview-empty{text-align:center;padding:70px 20px}@media(max-width:760px){.preview-grid{grid-template-columns:1fr}.preview-content{padding:20px}.preview-bar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="preview-shell"><div class="preview-bar"><div><span class="preview-badge">Private operator preview</span><div>This is the current browser draft. It is not published and customers cannot access it.</div></div><button class="button secondary" type="button" onclick="window.close()">Close preview</button></div><div id="previewRoot"></div></main>
<script type="module" src="assets/js/operator-listing-preview.js?v=2"></script>
</body></html>
