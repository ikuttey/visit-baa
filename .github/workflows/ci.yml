name: Visit Baa V2 checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run source, unit and Operator V2 checks
        run: npm test

      - name: Run public browser checks
        run: npm run test:browser:public

      - name: Run facilities browser checks
        run: npm run test:browser:facilities

      - name: Run marketplace browser checks
        run: npm run test:browser:marketplace
