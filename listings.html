<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Explore Baa Atoll listings — Baa Local</title>
  <meta name="description" content="Browse approved local stays, experiences, food, and transfers across Baa Atoll.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header"><div class="app-header-inner"><a href="index (1).html" class="brand"><span class="brand-mark"></span>Baa Local</a><nav class="app-nav"><a href="index (1).html#islands">Islands</a><a href="register.html">List your business</a><a href="login.html">Operator portal</a></nav></div></header>
    <main class="page-wrap">
      <div class="page-heading"><div><span class="eyebrow">Approved local listings</span><h1>Stay, explore, and move around Baa.</h1><p>Only active listings from administrator-verified businesses appear here.</p></div></div>
      <div id="configMessage" hidden></div><div id="listingsMessage" role="status" aria-live="polite" hidden></div>
      <section class="panel" aria-label="Listing filters">
        <div class="filters"><select id="islandFilter" aria-label="Filter by island"><option value="">All islands</option><option>Dharavandhoo</option><option>Dhonfanu</option><option>Eydhafushi</option><option>Fehendhoo</option><option>Fulhadhoo</option><option>Goidhoo</option><option>Hithaadhoo</option><option>Kamadhoo</option><option>Kendhoo</option><option>Kihaadhoo</option><option>Kudarikilu</option><option>Maalhos</option><option>Thulhaadhoo</option></select><select id="categoryFilter" aria-label="Filter by category"><option value="">All categories</option><option value="accommodation">Accommodation</option><option value="excursion">Excursion</option><option value="diving">Diving</option><option value="snorkelling">Snorkelling</option><option value="fishing">Fishing</option><option value="watersports">Watersports</option><option value="food_dining">Food and dining</option><option value="transfer">Transfer</option><option value="conservation_experience">Conservation experience</option><option value="community_experience">Community experience</option><option value="other">Other</option></select><button id="clearFilters" class="button secondary" type="button">Clear filters</button></div>
        <div id="listingGrid" class="listing-grid"></div>
      </section>
    </main>
    <footer class="app-footer"><div class="app-footer-inner"><span>Baa Local · approved local-island tourism</span><a href="register.html">Become an operator</a></div></footer>
  </div>
  <script src="config.js"></script><script type="module" src="assets/js/public-listings.js"></script>
</body>
</html>
