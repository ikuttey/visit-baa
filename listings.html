<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Explore Baa Atoll listings — Baa Local</title>
  <meta name="description" content="Browse approved local stays, experiences, food, and transfers across Baa Atoll.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="assets/css/manta-planner.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header"><div class="app-header-inner"><a href="index.html" class="brand"><span class="brand-mark"></span>Visit Baa</a><nav class="app-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="listings.html" aria-current="page">Explore listings</a><a href="traveler-dashboard.html">My Baa Trip</a></nav></div></header>
    <main class="page-wrap">
      <div class="page-heading"><div><span class="eyebrow">Approved local listings</span><h1>Stay, explore, and move around Baa.</h1><p>Only active listings from administrator-verified businesses appear here.</p></div></div>
      <div id="configMessage" hidden></div><div id="listingsMessage" role="status" aria-live="polite" hidden></div>
      <section class="panel" aria-label="Listing filters">
        <nav id="islandServiceTabs" class="island-service-tabs" aria-label="Services on this island" hidden></nav>
        <div class="filters marketplace-filter-bar"><input id="searchFilter" type="search" aria-label="Search listings and providers" placeholder="Search service, provider or island"><select id="islandFilter" aria-label="Filter by island"><option value="">All islands</option><option>Dharavandhoo</option><option>Dhonfanu</option><option>Eydhafushi</option><option>Fehendhoo</option><option>Fulhadhoo</option><option>Goidhoo</option><option>Hithaadhoo</option><option>Kamadhoo</option><option>Kendhoo</option><option>Kihaadhoo</option><option>Kudarikilu</option><option>Maalhos</option><option>Thulhaadhoo</option></select><select id="categoryFilter" aria-label="Filter by category"><option value="">All categories</option><option value="accommodation">Accommodation</option><option value="excursion">Excursions</option><option value="packages">Packages</option><option value="diving">Diving</option><option value="snorkelling">Snorkelling</option><option value="fishing">Fishing</option><option value="watersports">Watersports</option><option value="food_dining">Food and dining</option><option value="transfer">Transport</option><option value="conservation_experience">Conservation experience</option><option value="community_experience">Community experience</option><option value="other">Other</option></select><select id="listingTypeFilter" aria-label="Filter excursions by type"><option value="">Packages and individual activities</option><option value="packages">Packages</option><option value="individual">Individual activities</option></select><select id="activityFilter" aria-label="Filter by included activity"><option value="">All activities</option></select><select id="sortFilter" aria-label="Sort listings"><option value="recommended">Recommended</option><option value="price_asc">Price: Low to High</option><option value="price_desc">Price: High to Low</option></select><button id="toggleFilters" class="button secondary" type="button" aria-expanded="false">Filters</button><button id="toggleMap" class="button secondary" type="button" aria-expanded="false">Show map</button><button id="clearFilters" class="button secondary" type="button">Clear filters</button></div>
        <div id="advancedFilters" class="advanced-filters" hidden><div class="form-grid three"><div class="field accommodation-search-field"><label for="checkinFilter">Check-in</label><input id="checkinFilter" type="date"></div><div class="field accommodation-search-field"><label for="checkoutFilter">Check-out</label><input id="checkoutFilter" type="date"></div><div class="field activity-search-field"><label for="dateFilter">Activity / travel date</label><input id="dateFilter" type="date"></div><div class="field"><label for="adultsFilter">Adults</label><input id="adultsFilter" type="number" min="1" value="1"></div><div class="field"><label for="childrenFilter">Children</label><input id="childrenFilter" type="number" min="0" value="0"></div><div class="field accommodation-search-field"><label for="roomsFilter">Rooms</label><input id="roomsFilter" type="number" min="1" value="1"></div><div class="field"><label for="minPriceFilter">Minimum price</label><input id="minPriceFilter" type="number" min="0" step="0.01"></div><div class="field"><label for="maxPriceFilter">Maximum price</label><input id="maxPriceFilter" type="number" min="0" step="0.01"></div><div class="field full"><span class="fieldset-title">Facilities & services</span><div id="facilityFilters" class="compact-facility-filters"></div></div></div><div class="form-actions"><button id="applyFilters" class="button aqua" type="button">Apply filters</button></div></div>
        <div id="resultsSummary" class="results-summary" aria-live="polite"></div><div id="listingMap" class="listing-map" hidden></div>
        <div id="listingGrid" class="listing-grid"></div>
        <div class="form-actions result-actions"><button id="loadMoreListings" class="button secondary" type="button" hidden>Load more</button></div>
      </section>
    </main>
    <footer class="app-footer"><div class="app-footer-inner"><span>Visit Baa · approved local-island tourism</span><a href="register.html">Become an operator</a></div></footer>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="config.js"></script><script type="module" src="assets/js/public-listings.js"></script>
  <script type="module" src="assets/js/manta-planner.js"></script>
</body>
</html>
