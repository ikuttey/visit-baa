<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password — Baa Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-story"><a href="index.html" class="brand"><span class="brand-mark"></span>Visit Baa</a><div><span class="eyebrow" style="color:var(--aqua)">Account recovery</span><h1>Get securely back to your dashboard.</h1><p>We will send a password-recovery link if the address belongs to an account.</p></div><small>For privacy, the response does not reveal whether an email is registered.</small></section>
    <section class="auth-panel"><div class="auth-card" style="max-width:520px"><span class="eyebrow">Forgot password</span><h2>Request a reset link</h2><div id="configMessage" hidden></div><div id="formMessage" role="status" aria-live="polite" hidden></div><form id="forgotForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></div><div class="form-actions"><button class="button aqua" type="submit">Send reset link</button></div></form><div class="auth-links"><a href="login.html">Return to login</a></div></div></section>
  </main>
  <script src="config.js"></script><script type="module" src="assets/js/forgot-password.js"></script>
</body>
</html>
