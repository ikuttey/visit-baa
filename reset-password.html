<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose a new password — Baa Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-story"><a href="index (1).html" class="brand"><span class="brand-mark"></span>Baa Local</a><div><span class="eyebrow" style="color:var(--aqua)">Account recovery</span><h1>Choose a strong new password.</h1><p>This page accepts only a valid Supabase recovery session from the email link.</p></div><small>Never share a password-reset link with another person.</small></section>
    <section class="auth-panel"><div class="auth-card" style="max-width:520px"><span class="eyebrow">New password</span><h2>Update your password</h2><div id="configMessage" hidden></div><div id="formMessage" role="status" aria-live="polite" hidden></div><form id="resetForm"><div class="form-grid" style="grid-template-columns:1fr"><div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required></div></div><div class="form-actions"><button class="button aqua" type="submit" disabled>Update password</button></div></form><div class="auth-links"><a href="login.html">Return to login</a></div></div></section>
  </main>
  <script src="config.js"></script><script type="module" src="assets/js/reset-password.js"></script>
</body>
</html>
