<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Listing details — Visit Baa</title>
  <meta name="description" content="View verified Baa Atoll listing details, facilities, rooms, availability, and traveler reviews.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/manta-planner.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header"><div class="app-header-inner"><a href="index.html" class="brand"><span class="brand-mark"></span>Visit Baa</a><nav class="app-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="listings.html" aria-current="page">Explore listings</a><a href="traveler-dashboard.html">My Baa Trip</a></nav></div></header>
    <main class="page-wrap"><div id="configMessage" hidden></div><div id="detailMessage" role="status" aria-live="polite" hidden></div><div id="listingDetail"></div></main>
    <footer class="app-footer"><div class="app-footer-inner"><span>Visit Baa</span><a href="listings.html">Browse more listings</a></div></footer>
  </div>
  <dialog id="enquiryDialog" class="dialog"><div class="dialog-body"><div class="dialog-head"><div><span class="eyebrow">Booking enquiry</span><h2>Request availability</h2></div><button id="closeEnquiry" class="icon-button" type="button" aria-label="Close enquiry form">×</button></div>
    <div id="enquiryMessage" role="status" aria-live="polite" hidden></div><p class="message warning">This is an enquiry, not an instant booking. Your place is confirmed only after the operator accepts it.</p>
    <form id="enquiryForm"><div class="form-grid"><div class="field full experience-booking-field"><label for="availabilitySelect">Available schedule</label><select id="availabilitySelect"><option value="">Choose manually</option></select></div><div class="field full accommodation-booking-field" hidden><label for="roomSelect">Room type</label><select id="roomSelect"></select></div><div class="field full accommodation-booking-field" hidden><label for="ratePlanSelect">Rate plan</label><select id="ratePlanSelect"><option value="">Standard room rate</option></select></div><div class="field"><label for="requestedDate" id="requestedDateLabel">Requested date</label><input id="requestedDate" type="date" required></div><div class="field accommodation-booking-field" hidden><label for="checkOutDate">Check-out</label><input id="checkOutDate" type="date"></div><div class="field experience-booking-field"><label for="requestedTime">Requested time</label><input id="requestedTime" type="time"></div><div class="field"><label for="guestCount" id="guestCountLabel">Adults / guests</label><input id="guestCount" type="number" min="1" required></div><div class="field"><label for="childrenCount">Children</label><input id="childrenCount" type="number" min="0" value="0"></div><div class="field accommodation-booking-field" hidden><label for="roomsRequested">Rooms</label><input id="roomsRequested" type="number" min="1" value="1"></div><div class="field package-booking-field" hidden><label for="packagePickupSelect">Package pickup</label><select id="packagePickupSelect"><option value="">Use the provider's stated arrangement</option></select></div><div class="field package-booking-field" hidden><label for="packageDropoffSelect">Package drop-off</label><select id="packageDropoffSelect"><option value="">Use the provider's stated arrangement</option></select></div><div id="bookingOptionalExtras" class="field full booking-optional-extras"></div><div class="field"><label for="guestName">Full name</label><input id="guestName" autocomplete="name" required maxlength="120"></div><div class="field"><label for="guestEmail">Email</label><input id="guestEmail" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="guestPhone">Phone or WhatsApp</label><input id="guestPhone" autocomplete="tel" required maxlength="80"></div><div class="field full"><label for="guestMessage">Optional message</label><textarea id="guestMessage" maxlength="2000"></textarea></div></div><div id="bookingQuote" class="booking-quote"></div><div class="form-actions"><button class="button aqua" type="submit">Send enquiry</button></div></form>
  </div></dialog>
  <dialog id="galleryDialog" class="dialog gallery-dialog"><div class="gallery-lightbox"><button id="closeGallery" class="icon-button" type="button" aria-label="Close gallery">×</button><button id="previousGalleryImage" class="gallery-nav previous" type="button" aria-label="Previous image">←</button><figure><img id="galleryLightboxImage" alt=""><figcaption id="galleryLightboxCaption"></figcaption></figure><button id="nextGalleryImage" class="gallery-nav next" type="button" aria-label="Next image">→</button><span id="galleryCounter" class="gallery-counter"></span></div></dialog>
  <script src="config.js"></script><script type="module" src="assets/js/listing-detail.js"></script>
  <script type="module" src="assets/js/listing-view-tracker.js"></script>
  <script type="module" src="assets/js/manta-planner.js"></script>
</body>
</html>
