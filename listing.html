<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Listing details — Baa Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header"><div class="app-header-inner"><a href="index (1).html" class="brand"><span class="brand-mark"></span>Baa Local</a><nav class="app-nav"><a href="listings.html">All listings</a><a href="register.html">List your business</a><a href="login.html">Operator portal</a></nav></div></header>
    <main class="page-wrap"><div id="configMessage" hidden></div><div id="detailMessage" role="status" aria-live="polite" hidden></div><div id="listingDetail"></div></main>
    <footer class="app-footer"><div class="app-footer-inner"><span>Baa Local</span><a href="listings.html">Browse more listings</a></div></footer>
  </div>
  <dialog id="enquiryDialog" class="dialog"><div class="dialog-body"><div class="dialog-head"><div><span class="eyebrow">Booking enquiry</span><h2>Request availability</h2></div><button id="closeEnquiry" class="icon-button" type="button" aria-label="Close enquiry form">×</button></div><div id="enquiryMessage" role="status" aria-live="polite" hidden></div><p class="message warning">This is an enquiry, not an instant booking. Your place is confirmed only after the operator accepts it.</p><form id="enquiryForm"><div class="form-grid"><div class="field full"><label for="availabilitySelect">Available schedule</label><select id="availabilitySelect"><option value="">Choose manually</option></select></div><div class="field"><label for="requestedDate">Requested date</label><input id="requestedDate" type="date" required></div><div class="field"><label for="requestedTime">Requested time</label><input id="requestedTime" type="time"></div><div class="field"><label for="guestCount">Number of guests</label><input id="guestCount" type="number" min="1" required></div><div class="field"><label for="guestName">Full name</label><input id="guestName" autocomplete="name" required maxlength="120"></div><div class="field"><label for="guestEmail">Email</label><input id="guestEmail" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="guestPhone">Phone or WhatsApp</label><input id="guestPhone" autocomplete="tel" required maxlength="80"></div><div class="field full"><label for="guestMessage">Optional message</label><textarea id="guestMessage" maxlength="2000"></textarea></div></div><div class="form-actions"><button class="button aqua" type="submit">Send enquiry</button></div></form></div></dialog>
  <script src="config.js"></script><script type="module" src="assets/js/listing-detail.js"></script>
</body>
</html>
